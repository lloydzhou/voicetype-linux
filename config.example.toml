# voicetype 配置文件
# 路径: ~/.config/voicetype/config.toml

# 界面/识别语言: en | zh-Hans | zh-Hant | ja | ko
language = "zh-Hans"

# ASR 引擎: sensevoice（默认, SenseVoiceSmall INT8, 推荐）| whisper（旧路径）
engine = "sensevoice"

# SenseVoice 模型目录 (model.int8.onnx + tokens.txt)
sensevoice_dir = "/home/YOURUSER/.local/share/voicetype/models/sensevoice/"

# Whisper 模型路径 (ggml 格式, 建议 ggml-base.bin; engine = "whisper" 时使用)
model_path = "/home/YOURUSER/.local/share/voicetype/models/ggml-base.bin"

# 快捷键（按住说话，松开任意一个键提交）。多个组合用数组列出，任一组合
# 生效即可。可用键名：LeftCtrl RightCtrl LeftShift RightShift LeftAlt
# RightAlt LeftSuper RightSuper(或 LeftWin RightWin) Space CapsLock，
# 也可以直接写 evdev 键码（如 "F13" 对应键盘上报的键码需自行确认）。
# 默认 ["RightCtrl+RightShift"]。注意 Ctrl+Shift 等组合可能同时触发输入法
# 或桌面快捷键；单键（如 RightAlt）会占用该键的正常输入功能。
# hotkeys = ["RightCtrl+RightShift"]

hotkey = "RightCtrl+RightShift (hold to talk)"  # 兼容保留, 仅展示

# 保留的兼容配置项；剪贴板注入不会切换输入法。
ime_switch = false

[llm]
# 是否启用 LLM 润色 (需要同时配置 api_key)
enabled = false
# OpenAI 兼容 API 地址, 末尾斜杠可有可无
base_url = "https://api.openai.com/v1"
api_key = ""
model = "gpt-4o-mini"
